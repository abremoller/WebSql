<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WebSql</title>
    <base href="/" />
    <link href="_content/Havit.Blazor.Components.Web.Bootstrap/bootstrap.css" rel="stylesheet" />
    <link href="_content/Havit.Blazor.Components.Web.Bootstrap/defaults.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="WebSql.Client.styles.css" rel="stylesheet" />


</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="_content/BlazorMonaco/jsInterop.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.setupKeyboardShortcuts = function (dotNetHelper) {
            document.addEventListener('keydown', function (e) {
                // F5 to execute query
                if (e.key === 'F5') {
                    e.preventDefault();
                    dotNetHelper.invokeMethodAsync('ExecuteQueryShortcut');
                }
            });
        };

        window.downloadFile = function (filename, base64Content) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = 'data:text/csv;base64,' + base64Content;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
</body>

</html>
